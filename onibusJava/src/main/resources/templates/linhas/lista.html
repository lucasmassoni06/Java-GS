<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Linhas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h1 class="mt-5">Linhas</h1>

    <div class="alert alert-warning" th:if="${param.erro}">
        Nao foi possivel excluir: existem registros vinculados.
    </div>

    <a th:href="@{/linhas/novo}" class="btn btn-primary mb-3">Nova Linha</a>

    <table class="table table-striped mt-3">
        <thead>
        <tr>
            <th>Codigo</th>
            <th>Nome</th>
            <th>Origem</th>
            <th>Destino</th>
            <th>Ativa</th>
            <th>Acoes</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="linha : ${linhas}">
            <td th:text="${linha.codigoLinha}"></td>
            <td th:text="${linha.nomeLinha}"></td>
            <td th:text="${linha.origem}"></td>
            <td th:text="${linha.destino}"></td>
            <td th:text="${linha.ativa == 'S' ? 'Sim' : 'Nao'}"></td>
            <td>
                <a th:href="@{/linhas/editar/{id}(id=${linha.idLinha})}"
                   class="btn btn-warning btn-sm me-1">Editar</a>
                <a th:href="@{/linhas/excluir/{id}(id=${linha.idLinha})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Tem certeza que deseja excluir esta linha?')">Excluir</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/}" class="btn btn-secondary">Voltar</a>
</div>
</body>
</html>
