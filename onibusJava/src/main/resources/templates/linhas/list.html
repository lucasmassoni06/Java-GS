<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Linhas</title>
</head>
<body>
<div layout:fragment="conteudo">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h4 mb-0">Linhas</h2>
        <a class="btn btn-success" th:href="@{/linhas/novo}">Nova Linha</a>
    </div>
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Codigo</th>
                    <th>Nome</th>
                    <th>Origem</th>
                    <th>Destino</th>
                    <th>Ativa</th>
                    <th class="text-end">Acoes</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="l : ${linhas}">
                    <td th:text="${l.codigoLinha}"></td>
                    <td th:text="${l.nomeLinha}"></td>
                    <td th:text="${l.origem}"></td>
                    <td th:text="${l.destino}"></td>
                    <td>
                        <span class="badge rounded-pill"
                              th:classappend="${l.ativa == 'S'} ? 'bg-success' : 'bg-secondary'"
                              th:text="${l.ativa == 'S'} ? 'Sim' : 'Nao'"></span>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{'/linhas/' + ${l.idLinha} + '/editar'}">Editar</a>
                        <a class="btn btn-sm btn-outline-danger" th:href="@{'/linhas/' + ${l.idLinha} + '/excluir'}">Excluir</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(linhas)}">
                    <td colspan="6" class="text-center text-muted">Nenhuma linha cadastrada.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
