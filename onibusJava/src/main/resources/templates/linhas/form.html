<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Linha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h1 class="mt-5" th:text="${acao} == '/linhas' ? 'Nova Linha' : 'Editar Linha'"></h1>

    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

    <form th:action="${acao}" th:object="${linha}" method="post">
        <div class="mb-3">
            <label for="codigoLinha" class="form-label">Codigo</label>
            <input type="text" class="form-control" id="codigoLinha" th:field="*{codigoLinha}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('codigoLinha')}" th:errors="*{codigoLinha}"></div>
        </div>
        <div class="mb-3">
            <label for="nomeLinha" class="form-label">Nome</label>
            <input type="text" class="form-control" id="nomeLinha" th:field="*{nomeLinha}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('nomeLinha')}" th:errors="*{nomeLinha}"></div>
        </div>
        <div class="mb-3">
            <label for="origem" class="form-label">Origem</label>
            <input type="text" class="form-control" id="origem" th:field="*{origem}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('origem')}" th:errors="*{origem}"></div>
        </div>
        <div class="mb-3">
            <label for="destino" class="form-label">Destino</label>
            <input type="text" class="form-control" id="destino" th:field="*{destino}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('destino')}" th:errors="*{destino}"></div>
        </div>
        <div class="mb-3">
            <label for="ativa" class="form-label">Ativa</label>
            <select class="form-control" id="ativa" th:field="*{ativa}" required>
                <option value="S">Sim</option>
                <option value="N">Nao</option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('ativa')}" th:errors="*{ativa}"></div>
        </div>
        <button type="submit" class="btn btn-success">Salvar</button>
        <a th:href="@{/linhas}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
