<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Leitura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h1 class="mt-5" th:text="${acao} == '/leituras' ? 'Nova Leitura' : 'Editar Leitura'"></h1>

    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

    <form th:action="${acao}" th:object="${leitura}" method="post">
        <div class="mb-3">
            <label for="idCamera" class="form-label">Camera</label>
            <select class="form-control" id="idCamera" th:field="*{idCamera}" required>
                <option value="">Selecione</option>
                <option th:each="c : ${cameras}" th:value="${c.idCamera}"
                        th:text="${c.nomeCamera}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('idCamera')}" th:errors="*{idCamera}"></div>
        </div>

        <div class="mb-3">
            <label for="idOperacao" class="form-label">Operacao</label>
            <select class="form-control" id="idOperacao" th:field="*{idOperacao}" required>
                <option value="">Selecione</option>
                <option th:each="op : ${operacoes}" th:value="${op.idOperacao}"
                        th:text="${op.linha != null ? op.linha.nomeLinha + ' - ' + op.idOperacao : op.idOperacao}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('idOperacao')}" th:errors="*{idOperacao}"></div>
        </div>

        <div class="mb-3">
            <label for="contagemPessoas" class="form-label">Contagem de Pessoas</label>
            <input type="number" min="0" class="form-control" id="contagemPessoas"
                   th:field="*{contagemPessoas}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('contagemPessoas')}" th:errors="*{contagemPessoas}"></div>
        </div>

        <div class="mb-3">
            <label for="dataHoraLeitura" class="form-label">Data e Hora da Leitura</label>
            <input type="datetime-local" class="form-control" id="dataHoraLeitura"
                   th:field="*{dataHoraLeitura}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('dataHoraLeitura')}" th:errors="*{dataHoraLeitura}"></div>
        </div>

        <div class="mb-3">
            <label for="nivelConfianca" class="form-label">Nivel de Confianca (%)</label>
            <input type="number" step="0.01" min="0" max="100" class="form-control"
                   id="nivelConfianca" th:field="*{nivelConfianca}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('nivelConfianca')}" th:errors="*{nivelConfianca}"></div>
        </div>

        <div class="mb-3">
            <label for="statusLeitura" class="form-label">Status da Leitura</label>
            <select class="form-control" id="statusLeitura" th:field="*{statusLeitura}" required>
                <option value="">Selecione</option>
                <option value="PROCESSADA">Processada</option>
                <option value="PENDENTE">Pendente</option>
                <option value="ERRO">Erro</option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('statusLeitura')}" th:errors="*{statusLeitura}"></div>
        </div>

        <button type="submit" class="btn btn-success">Salvar</button>
        <a th:href="@{/leituras}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
