<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Status de Ocupacao</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h1 class="mt-5">Status de Ocupacao</h1>

    <div class="alert alert-warning" th:if="${param.erro}">
        Nao foi possivel excluir: existem registros vinculados.
    </div>

    <a th:href="@{/status/novo}" class="btn btn-primary mb-3">Novo Status</a>

    <table class="table table-striped mt-3">
        <thead>
        <tr>
            <th>Linha</th>
            <th>Frota</th>
            <th>Faixa</th>
            <th>Percentual</th>
            <th>Referencia</th>
            <th>Acoes</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${status}">
            <td th:text="${s.nomeLinha}"></td>
            <td th:text="${s.prefixoFrota}"></td>
            <td th:text="${s.nomeFaixa}"></td>
            <td th:text="${#numbers.formatDecimal(s.percentualOcupacao, 1, 1)} + '%'"></td>
            <td th:text="${s.dataHoraReferencia != null} ? ${#temporals.format(s.dataHoraReferencia, 'dd/MM/yyyy HH:mm')} : ''"></td>
            <td>
                <a th:href="@{/status/editar/{id}(id=${s.idStatus})}" class="btn btn-warning btn-sm me-1">Editar</a>
                <a th:href="@{/status/excluir/{id}(id=${s.idStatus})}" class="btn btn-danger btn-sm"
                   onclick="return confirm('Excluir este status?')">Excluir</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/}" class="btn btn-secondary">Voltar</a>
</div>
</body>
</html>
