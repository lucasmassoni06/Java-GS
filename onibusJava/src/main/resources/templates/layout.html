<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE - CitizenTech">CitizenTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">CitizenTech</a>
        <div>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" th:href="@{/linhas}">Linhas</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/leituras}">Leituras</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/status}">Status</a></li>
            </ul>
        </div>
    </div>
</nav>
<main class="container mt-4">
    <div th:if="${mensagem}" class="alert alert-success" role="alert" th:text="${mensagem}"></div>
    <div layout:fragment="conteudo"></div>
</main>
<footer class="container mt-4 mb-3 text-center text-muted small">
    CitizenTech &copy; 2025 - Monitoramento de ocupacao de transporte publico
</footer>
</body>
</html>
